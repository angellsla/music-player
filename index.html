<!DOCTYPE html>
<html lang="zh_cn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music-Player</title>
    <link rel="stylesheet" href="./css/font-awesome.min.css" />
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <!-- 音乐播放器 -->
    <div class="player-warp">
      <!-- 歌曲信息卡片 -->
      <div class="player-info">
        <div class="info">
          <div class="name">CHE.R.RY</div>
          <div class="singer-album">上坂堇</div>
          <!-- 进度条 -->
          <div class="music_progress">
            <div class="music_progress_top">
              <span class="current-time">00:00</span>
              <span class="time">03:29</span>
            </div>
            <div class="music_progress_bar">
              <div class="music_progress_line"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="player-control">
        <div class="cover">
          <img
            src="https://y.qq.com/music/photo_new/T002R300x300M000001YVx3h2XlAkF_1.jpg?max_age=2592000"
            alt="cover"
          />
        </div>
        <div class="control">
          <i id="prevBtn" class="fa fa-step-backward"></i>
          <i id="playBtn" class="fa fa-play"></i>
          <i id="nextBtn" class="fa fa-step-forward"></i>
          <i id="modeBtn" class="fa fa-random" title="随机播放"></i>
          <i id="openModal" class="fa fa-reorder"></i>
        </div>
      </div>
    </div>

    <div class="mask_bg"></div>

    <!-- 模态框 - 音乐列表 -->
    <div class="modal" id="playlistModal">
      <div class="modal-backdrop"></div>
      <div class="modal-box">
        <!-- 顶部标题栏 -->
        <div class="modal-header">
          <div class="modal-header-content">
            <div class="modal-title">
              <i class="fa fa-music modal-title-icon"></i>
              <span>音乐列表</span>
            </div>
            <div class="modal-close" id="modalCloseBtn">
              <i class="fa fa-times"></i>
            </div>
          </div>
        </div>

        <!-- 控制区域 -->
        <div class="modal-controls">
          <!-- 播放列表选择 -->
          <div class="playlist-select-wrap">
            <i class="fa fa-list-ul select-icon"></i>
            <select id="musicSelect" class="playlist-select">
              <!-- 动态填充列表信息 -->
            </select>
          </div>

          <!-- 音量控制 -->
          <div class="volume-controls">
            <div class="volume-wrap">
              <i class="fa fa-volume-down volume-icon"></i>
              <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.3">
              <i class="fa fa-volume-up volume-icon"></i>
            </div>
          </div>
        </div>

        <!-- 歌曲统计信息 -->
        <div class="playlist-stats">
          <span class="stats-count"><i class="fa fa-music"></i> <span id="totalCount">0</span> 首歌曲</span>
          <span class="stats-playing"><i class="fa fa-volume-up"></i> <span id="currentSongName">未播放</span></span>
        </div>

        <!-- 列表滚动区域 -->
        <div class="modal-wrapper">
          <div class="music-list" id="musicList">
            <!-- 动态填充歌曲项 -->
          </div>
        </div>
      </div>
    </div>

    <audio id="audio" src=""></audio>

    <script src="./js/jquery.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
